{% extends "base.html" %}
{% block title %}Set a new password — Shelfie{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <p class="font-stamp text-xs text-gold uppercase tracking-widest mb-2 text-center">New card, new lock</p>
  <h1 class="font-display text-3xl text-paper text-center mb-6">Choose a new password</h1>

  <div class="card-index rounded-sm p-6">
    <p id="status" class="text-sm text-ink/60 mb-4">Checking your reset link...</p>
    <form id="reset-form" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-stamp uppercase tracking-wide text-ink/50 mb-1">New password</label>
        <input type="password" id="new-password" required minlength="6" class="w-full bg-canvas/40 border border-ink/15 rounded-sm px-3 py-2 text-ink focus:outline-none focus:ring-1 focus:ring-gold">
      </div>
      <button type="submit" class="w-full bg-ink text-paper font-semibold rounded-sm py-2.5 hover:bg-gold hover:text-ink transition">Update password</button>
    </form>
  </div>
  <p class="text-sm text-paper/40 mt-4 text-center"><a href="/forgot-password" class="text-gold hover:text-gold-dark underline">Request a new link</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  const statusEl = document.getElementById('status');
  const form = document.getElementById('reset-form');
  const supabase = window.supabase.createClient("{{ supabase_url }}", "{{ supabase_anon_key }}");

  // Supabase's recovery link puts tokens in the URL fragment (#...) by
  // default — fragments never reach the server, so this has to run client-side.
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const queryParams = new URLSearchParams(window.location.search);
  const access_token = hashParams.get('access_token') || queryParams.get('access_token');
  const refresh_token = hashParams.get('refresh_token') || queryParams.get('refresh_token');

  if (!access_token) {
    statusEl.textContent = "This reset link is invalid or has expired. Request a new one below.";
    return;
  }

  supabase.auth.setSession({ access_token, refresh_token }).then(({ error }) => {
    if (error) {
      statusEl.textContent = "This reset link is invalid or has expired. Request a new one below.";
      return;
    }
    statusEl.textContent = "Link verified — choose a new password.";
    form.classList.remove('hidden');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('new-password').value;
    const { error } = await supabase.auth.updateUser({ password });
    if (error) {
      statusEl.textContent = error.message;
      return;
    }
    statusEl.textContent = "Password updated — redirecting to log in...";
    form.classList.add('hidden');
    setTimeout(() => { window.location.href = '/login'; }, 1500);
  });
})();
</script>
{% endblock %}
