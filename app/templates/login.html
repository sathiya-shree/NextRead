{% extends "base.html" %}
{% block title %}Log in — Shelfie{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="font-display text-2xl font-bold mb-6">Log in</h1>
  {% if error %}<p class="bg-red-50 text-red-700 text-sm p-3 rounded mb-4">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" required class="w-full border border-stone-300 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" name="password" required class="w-full border border-stone-300 rounded px-3 py-2">
    </div>
    <button class="w-full bg-amber-800 text-white rounded py-2 font-medium hover:bg-amber-900">Log in</button>
  </form>
  <p class="text-sm text-stone-500 mt-4">No account? <a href="/signup" class="text-amber-800 underline">Sign up</a></p>
</div>
{% endblock %}
