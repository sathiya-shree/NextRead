{% extends "base.html" %}
{% block title %}Sign up — Shelfie{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <p class="font-stamp text-xs text-gold uppercase tracking-widest mb-2 text-center">New card</p>
  <h1 class="font-display text-3xl text-paper text-center mb-6">Open a shelf</h1>
  <div class="card-index rounded-sm p-6">
    {% if error %}<p class="bg-rust/10 text-rust text-sm p-3 rounded-sm mb-4 border border-rust/30">{{ error }}</p>{% endif %}
    <form method="post" action="/signup" class="space-y-4">
      <div>
        <label class="block text-xs font-stamp uppercase tracking-wide text-ink/50 mb-1">Username</label>
        <input type="text" name="username" required class="w-full bg-canvas/40 border border-ink/15 rounded-sm px-3 py-2 text-ink focus:outline-none focus:ring-1 focus:ring-gold">
      </div>
      <div>
        <label class="block text-xs font-stamp uppercase tracking-wide text-ink/50 mb-1">Email</label>
        <input type="email" name="email" required class="w-full bg-canvas/40 border border-ink/15 rounded-sm px-3 py-2 text-ink focus:outline-none focus:ring-1 focus:ring-gold">
      </div>
      <div>
        <label class="block text-xs font-stamp uppercase tracking-wide text-ink/50 mb-1">Password</label>
        <input type="password" name="password" required minlength="6" class="w-full bg-canvas/40 border border-ink/15 rounded-sm px-3 py-2 text-ink focus:outline-none focus:ring-1 focus:ring-gold">
      </div>
      <button class="w-full bg-ink text-paper rounded-sm py-2.5 font-semibold hover:bg-gold hover:text-ink transition">Sign up</button>
    </form>
  </div>
  <p class="text-sm text-paper/40 mt-4 text-center">Already have an account? <a href="/login" class="text-gold hover:text-gold-dark underline">Log in</a></p>
</div>
{% endblock %}
