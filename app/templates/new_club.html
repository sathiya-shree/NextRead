{% extends "base.html" %}
{% block title %}Start a club — Shelfie{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <p class="font-stamp text-xs text-gold uppercase tracking-widest mb-2 text-center">Charter a table</p>
  <h1 class="font-display text-3xl text-paper text-center mb-6">Start a book club</h1>
  <div class="card-index rounded-sm p-6">
    <form method="post" action="/clubs/new" class="space-y-4">
      <div>
        <label class="block text-xs font-stamp uppercase tracking-wide text-ink/50 mb-1">Club name</label>
        <input type="text" name="name" required class="w-full bg-canvas/40 border border-ink/15 rounded-sm px-3 py-2 text-ink focus:outline-none focus:ring-1 focus:ring-gold">
      </div>
      <div>
        <label class="block text-xs font-stamp uppercase tracking-wide text-ink/50 mb-1">Description</label>
        <textarea name="description" rows="3" class="w-full bg-canvas/40 border border-ink/15 rounded-sm px-3 py-2 text-ink focus:outline-none focus:ring-1 focus:ring-gold"></textarea>
      </div>
      <label class="flex items-center gap-2 text-sm text-ink/60">
        <input type="checkbox" name="is_private" value="true"> Private club (invite only)
      </label>
      <button class="w-full bg-ink text-paper font-semibold rounded-sm py-2.5 hover:bg-gold hover:text-ink transition">Create club</button>
    </form>
  </div>
</div>
{% endblock %}
